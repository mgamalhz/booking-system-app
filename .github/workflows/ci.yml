name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  style:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint
        run: ./vendor/bin/pint --test

  analyse:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan migrate --force

      - name: Run tests
        run: composer test

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [style, analyse, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ vars.STAGING_HEALTH_URL }}
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Validate staging configuration
        run: |
          test -n "${{ secrets.STAGING_HOST }}"
          test -n "${{ secrets.STAGING_USER }}"
          test -n "${{ secrets.STAGING_SSH_KEY }}"
          test -n "${{ vars.STAGING_PATH }}"
          test -n "${{ vars.STAGING_HEALTH_URL }}"

      - name: Prepare SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_deploy_key
          chmod 600 ~/.ssh/staging_deploy_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/staging_deploy_key \
            -o IdentitiesOnly=yes \
            "$STAGING_USER@$STAGING_HOST" \
            "APP_DIR='$STAGING_PATH' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -euo pipefail

          cd "$APP_DIR"
          git fetch --prune origin main
          git checkout main
          git reset --hard "$DEPLOY_SHA"

          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan config:cache
          php artisan queue:restart
          REMOTE

      - name: Verify staging health
        env:
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        run: |
          status_code="$(curl --silent --show-error --location --output /tmp/staging-health-response.txt --write-out '%{http_code}' "$STAGING_HEALTH_URL")"
          cat /tmp/staging-health-response.txt
          if [ "$status_code" != "200" ]; then
            echo "Staging health check failed with HTTP $status_code"
            exit 1
          fi
